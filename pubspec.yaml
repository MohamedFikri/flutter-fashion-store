name: fashion_store
description: Fashion Store Mobile App - CIT211 Assignment

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  # State Management
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.3
  # UI & Utils
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.5
  image_picker: ^1.0.7
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
