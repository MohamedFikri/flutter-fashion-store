name: fashion_store
description: Fashion Store Mobile App - CIT211 Assignment

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  google_sign_in: ^6.2.1
  # State Management
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.3
  # UI & Utils
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # fluttertoast: ^8.2.8 # Temporarily commented due to Android build issues
  # Alternative: Use SnackBar or overlay_lib for toast notifications
  image_picker: ^1.0.7
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/icon/
